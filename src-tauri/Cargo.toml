[package]
name = "interview-kit"
version = "0.1.0"
description = "Personal interview knowledge workbench"
authors = ["Interview Kit"]
edition = "2021"

[lib]
name = "interview_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
